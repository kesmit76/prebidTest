<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magnite Prebid Test — Simple</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      max-width: 700px;
    }
    .ad-container {
      width: 300px;
      height: 250px;
      border: 1px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      font-family: monospace;
      font-size: 13px;
    }
    pre {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    h2 {
      margin-top: 30px;
      font-size: 16px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 4px;
    }
  </style>
</head>
<body>

  <h1>Magnite Prebid Test — Simple</h1>

  <p>
    Bidder: magnite<br>
    Account: 28475<br>
    Site: 643075<br>
    Zone: 4159483<br>
    Size: 300x250
  </p>

  <div id="div-gpt-ad-300x250" class="ad-container">Waiting for Magnite...</div>

  <div id="status" class="status">Starting auction...</div>

  <h2>Raw bidsBackHandler output</h2>
  <pre id="output">(waiting for auction to complete)</pre>

  <!-- Prebid.js -->
  <script async src="https://cdn.jsdelivr.net/npm/prebid.js@latest/dist/not-for-prod/prebid.js"></script>

  <script>
    var PREBID_TIMEOUT = 3000;

    var adUnits = [{
      code: 'div-gpt-ad-300x250',
      mediaTypes: {
        banner: {
          sizes: [[300, 250]]
        }
      },
      bids: [{
        bidder: 'magnite',
        params: {
          accountId: 28475,
          siteId: 643075,
          zoneId: 4159483
        }
      }]
    }];

    var pbjs = window.pbjs || {};
    pbjs.que = pbjs.que || [];

    function writeOutput(obj) {
      document.getElementById('output').textContent = JSON.stringify(obj, null, 2);
    }

    pbjs.que.push(function() {

      pbjs.setConfig({
        debug: true
      });

      // Log every raw bid response as it comes in, win or lose
      pbjs.onEvent('bidResponse', function(bid) {
        console.log('bidResponse event:', bid);
      });

      // Log explicit no-bid events (these fire even if bidsBackHandler shows nothing)
      pbjs.onEvent('noBid', function(bid) {
        console.log('noBid event:', bid);
        document.getElementById('status').innerHTML =
          'No-bid event received from bidder: ' + bid.bidder;
      });

      // Log any raw auction/bidder errors
      pbjs.onEvent('bidderError', function(err) {
        console.log('bidderError event:', err);
      });

      pbjs.addAdUnits(adUnits);

      pbjs.requestBids({
        bidsBackHandler: function(bids) {
          console.log('Full bidsBackHandler payload:', bids);
          writeOutput(bids);

          var slot = bids['div-gpt-ad-300x250'];

          if (slot && slot.bids && slot.bids.length > 0) {
            var winningBid = slot.bids[0];
            console.log('Winning bid:', winningBid);

            document.getElementById('status').innerHTML =
              'Bid returned! CPM: $' + winningBid.cpm +
              ' | Size: ' + winningBid.width + 'x' + winningBid.height;

            pbjs.renderAd(document, winningBid.adId);
          } else {
            document.getElementById('status').innerHTML =
              'No bid returned from Magnite (auction completed, empty result).';
          }
        },
        timeout: PREBID_TIMEOUT
      });
    });
  </script>

</body>
</html>
